name: release
# Makes a GitHub Release with the Windows installer when the owner pushes a
# version tag such as v0.9.0 (documentation/release_process.md). It never runs
# for a branch. The tag must be on main.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag, the app version and the changelog
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main. Releases are made from main only." }
          $match = Select-String -Path apps/pos_windows/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          $appVersion = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:TAG.Substring(1)
          if (-not ($tagVersion -eq $appVersion -or $tagVersion.StartsWith("$appVersion-"))) {
            throw "Tag $env:TAG does not match the app version $appVersion in apps/pos_windows/pubspec.yaml"
          }
          node tools/release/changelog.mjs --notes $appVersion | Out-File -FilePath release-notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no dated entry for $appVersion" }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pre = node tools/release/changelog.mjs --prerelease $tagVersion
          "PRERELEASE=$($pre.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Build the Windows app
        working-directory: apps/pos_windows
        run: |
          flutter pub get
          flutter build windows --release
      - name: Build the installer and the zip
        shell: pwsh
        run: ./tools/release/build-installer.ps1
      - name: Install, start and uninstall the installer (smoke test)
        shell: pwsh
        run: ./tools/release/smoke-test-installer.ps1
      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem build/installer | Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          $ghArgs = @('release', 'create', $env:TAG, '--verify-tag', '--title', "Apparel PoS $env:APP_VERSION", '--notes-file', 'release-notes.md')
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
          gh release view $env:TAG --json tagName,isPrerelease,assets --jq '{tag: .tagName, prerelease: .isPrerelease, files: [.assets[].name]}'
